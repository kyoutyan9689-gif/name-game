<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11110f" />
    <meta name="description" content="ひらがなを配置して日本人の氏名を作るゲーム、指名作成。" />
    <title>指名作成 | ひらがな氏名ゲーム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="指名作成 ホーム"><span class="brand-mark">指</span><span>指名作成</span></a>
        <div class="live-stats" aria-label="ゲーム成績">
          <div><small>TOTAL SCORE</small><strong id="total-score">0</strong></div>
          <div><small>PEOPLE</small><strong><span id="people-count">0</span><span class="unit">人</span></strong></div>
        </div>
      </header>

      <section id="setup-screen" class="screen setup-screen">
        <div class="eyebrow"><span></span> HIRAGANA NAME GAME</div>
        <h1>ひらがなを置いて、<br /><em>その人</em>をつくれ。</h1>
        <p class="lead">出てきた一文字を、好きなマスへ。<br />実在する苗字と名前を完成させよう。</p>

        <div class="settings-card">
          <div class="setting-row">
            <div><span class="step-num">01</span><label for="surname-length">苗字の文字数</label></div>
            <div class="select-wrap"><select id="surname-length" aria-label="苗字の文字数"></select><span>文字</span></div>
          </div>
          <div class="divider"></div>
          <div class="setting-row">
            <div><span class="step-num">02</span><label for="given-length">名前の文字数</label></div>
            <div class="select-wrap"><select id="given-length" aria-label="名前の文字数"></select><span>文字</span></div>
          </div>
        </div>

        <button id="start-button" class="primary-button">GAME START <span>→</span></button>
        <p class="rule-note">一度置いた文字は動かせません</p>
      </section>

      <section id="game-screen" class="screen game-screen hidden" aria-live="polite">
        <div class="phase-heading">
          <span id="phase-number">PHASE 1 / 2</span>
          <h2 id="phase-title">苗字を作成</h2>
          <p id="phase-hint">空いているマスをタップ</p>
        </div>
        <div id="slots" class="slots" aria-label="文字を置くマス"></div>

        <div class="draw-area">
          <small>NEXT LETTER</small>
          <div id="current-letter" class="current-letter">た</div>
          <div id="transform-buttons" class="transform-buttons" aria-label="文字の加工"></div>
          <p id="transform-note">配置する前なら加工できます</p>
        </div>

        <section class="history-panel">
          <div class="history-head"><h3>完成した人物</h3><span id="history-count">0 PEOPLE</span></div>
          <ol id="history-list"><li class="empty-history">まだ人物は完成していません</li></ol>
        </section>
      </section>

      <section id="result-screen" class="screen result-screen hidden" aria-live="assertive">
        <div id="result-badge" class="result-badge">GAME OVER</div>
        <h2 id="result-title">登録されていません</h2>
        <p id="result-detail"></p>
        <div id="completed-name" class="completed-name hidden"></div>
        <div id="earned-score" class="earned-score hidden"></div>

        <div id="final-summary" class="final-summary hidden">
          <div><small>TOTAL SCORE</small><strong id="final-score">0</strong></div>
          <div><small>完成した人数</small><strong id="final-people">0人</strong></div>
          <div class="best"><small>BEST SCORE</small><strong id="best-score">0</strong></div>
        </div>
        <ol id="final-history" class="final-history hidden"></ol>
        <button id="action-button" class="primary-button">RETRY <span>↻</span></button>
      </section>
    </main>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
